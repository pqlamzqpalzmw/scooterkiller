<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LP60 Geofence</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><h1>LP60 Geofence</h1><p>BLE proximity + geofence fleet monitor</p></div><button id="scan">Scan for scooters</button></header><section class="grid"><div class="card"><h2>Policy</h2><label>Outside/too close response<select id="policy"><option value="5">Limit to 5 mph</option><option value="lock">Lock scooter</option></select></label><label>Boundary buffer (ft)<input id="buffer" type="number" min="0" value="25"></label><button id="setFence">Set current location as center</button><p id="location">Location not set</p></div><div class="card"><h2>Fleet</h2><div id="fleet"><p class="muted">No scooters detected.</p></div></div></section><section class="card"><h2>Event log</h2><pre id="log">Ready.</pre></section><footer>Web Bluetooth support varies by browser/device. The command adapter is intentionally separated from detection and policy logic.</footer></main><script src="app.js"></script></body></html>
